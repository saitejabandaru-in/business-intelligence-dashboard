[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bi-dashboard"
version = "1.0.0"
description = "End-to-end BI platform with KPI analytics, interactive dashboards, cross-filtering, and automated reporting pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Sai Teja Bandaru", email = "Saitejaroyal2311@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "streamlit>=1.34",
    "pandas>=2.2",
    "plotly>=5.22",
    "sqlalchemy>=2.0",
    "requests>=2.32",
    "reportlab>=4.2",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "build",
    "twine",
]

[project.scripts]
bi-dashboard = "bi_dashboard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["bi_dashboard"]
